      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="100%" stop-color="#c81e1e"/>
    </linearGradient>
    <linearGradient id="bottomWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>

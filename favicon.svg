  <!-- Center Black Band -->
  <line x1="2" y1="32" x2="62" y2="32" stroke="#0f172a" stroke-width="5"/>
  <!-- Center Button Outer -->
  <circle cx="32" cy="32" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
  <!-- Center Button Inner -->
